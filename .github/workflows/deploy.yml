name: Deploy to EC2 (Spring + FastAPI)

on:
  push:
    branches: [ "main" ]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  SPRING_IMAGE_NAME: classmap-spring
  AI_IMAGE_NAME: classmap-ai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # 1. Spring Boot 빌드 및 이미지 push
      # ---------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Spring Boot with Gradle
        run: ./gradlew clean bootJar -x test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Spring Boot Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.SPRING_IMAGE_NAME }}:latest

      # ---------------------------------------------------
      # 2. AI Server (FastAPI) 이미지 push
      # ---------------------------------------------------
      - name: Build and Push AI Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-server
          file: ./ai-server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.AI_IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 배포 시작..."
            
            # 1. Docker Hub 로그인
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # 2. 작업 폴더 생성 및 이동
            cd /home/ubuntu/my-project || mkdir -p /home/ubuntu/my-project && cd /home/ubuntu/my-project
            
            # 3. docker-compose.yml 파일 생성 (덮어쓰기)
            cat <<EOF > docker-compose.yml
            version: '3.8'
            services:
              spring-boot:
                image: ${{ secrets.DOCKER_USERNAME }}/${{ env.SPRING_IMAGE_NAME }}:latest
                ports:
                  - "8080:8080"
                environment:
                  - SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
                  - SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
                  - SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
            
                  - AI_SERVER_URL=http://ai-server:8000
                  - OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
                  - GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
                  - JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            
            
            
                  # [AWS S3 설정]
                  - AWS_REGION=ap-northeast-2
                  - AWS_S3_BUCKET=edu-note-files
                  - AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
                  - AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
                depends_on:
                  - ai-server

              ai-server:
                image: ${{ secrets.DOCKER_USERNAME }}/${{ env.AI_IMAGE_NAME }}:latest
                ports:
                  - "8000:8000"
                environment:
                  - OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
                  - GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}

            EOF

            # 4. 최신 이미지 Pull 및 컨테이너 재시작
            docker compose pull
            docker compose up -d
            docker image prune -f
            
            echo "🎉 배포 완료!"