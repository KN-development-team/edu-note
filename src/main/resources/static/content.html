<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduNote - 내용 보기</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root{
          --bg-0: #f4f9ff;
          --bg-1: #eaf3ff;
          --bg-2: #dfeeff;

          --white: #ffffff;
          --text: #1f2937;
          --muted: #6b7280;
          --line: #e5e7eb;

          --primary: #2563eb;
          --primary-hover: #1d4ed8;
          --primary-press: #1e40af;

          --danger: #dc2626;

          --card-bg: rgba(255, 255, 255, 0.95);
          --shadow-md: 0 10px 30px rgba(0,0,0,0.06);
          --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);

          --radius-lg: 16px;
          --radius-md: 12px;
        }

        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
          background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 40%, var(--bg-2) 100%);
          min-height: 100vh;
          color: var(--text);
        }

        /* Navbar: index 톤 */
        .navbar {
          background: var(--white);
          padding: 16px 40px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          border-bottom: 1px solid var(--line);
          position: sticky;
          top: 0;
          z-index: 100;
          box-shadow: none; /* shadow 대신 border로 깔끔 */
        }
        .navbar-brand {
          font-size: 18px;
          font-weight: 700;
          color: var(--text);
          letter-spacing: -0.3px;
        }
        .user-info {
          display: flex;
          align-items: center;
          gap: 14px;
          font-size: 14px;
          color: var(--muted);
          font-weight: 600;
        }
        .btn-logout {
          color: var(--danger);
          background: none;
          border: none;
          cursor: pointer;
          font-weight: 700;
          padding: 8px 10px;
          border-radius: 8px;
          transition: background 0.2s;
        }
        .btn-logout:hover { background: rgba(220,38,38,0.06); }

        .container {
          max-width: 1000px;
          margin: 40px auto;
          padding: 0 20px;
        }

        /* Card: 부드러운 유리감(blur 없이 렉 방지) */
        .card {
          background: var(--card-bg);
          border-radius: var(--radius-lg);
          padding: 30px;
          border: 1px solid rgba(229,231,235,0.85);
          box-shadow: var(--shadow-md);
        }

        #title{
          font-size: 20px;
          letter-spacing: -0.3px;
          margin-bottom: 6px;
        }

        .meta {
          display: flex;
          flex-wrap: wrap;
          gap: 10px 20px;
          margin: 10px 0 20px;
          color: var(--muted);
          font-size: 13px;
        }
        .meta strong{ color: var(--text); }

        /* content box */
        .content-box {
          border: 1px solid var(--line);
          border-radius: var(--radius-md);
          padding: 18px;
          background: rgba(249,250,251,0.85);
          white-space: pre-wrap;
          line-height: 1.7;
          color: #111827;
          font-size: 15px;
        }

        /* summary box: 노란 느낌을 살리되 과하지 않게 */
        #summaryBox h3{
          margin-bottom: 8px;
          font-size: 15px;
          letter-spacing: -0.2px;
          color: var(--text);
        }
        #summaryText{
          background: #fff8db;         /* 기존 #fffbe6보다 살짝 톤다운 */
          border-color: #fde68a;       /* 따뜻한 라인 */
          color: #92400e;
        }

        .actions {
          display: flex;
          gap: 10px;
          margin-top: 18px;
          flex-wrap: wrap;
        }

        .btn {
          padding: 10px 14px;
          border-radius: 10px;
          border: 1px solid transparent;
          cursor: pointer;
          font-weight: 800;
          font-size: 13px;
          transition: transform 0.02s, background 0.2s, border-color 0.2s;
          user-select: none;
        }
        .btn:active { transform: translateY(1px); }

        .btn-back {
          background: white;
          color: var(--text);
          border-color: #d1d5db;
        }
        .btn-back:hover { background: #f9fafb; }

        .btn-copy {
          background: var(--primary);
          color: white;
        }
        .btn-copy:hover { background: var(--primary-hover); }
        .btn-copy:active { background: var(--primary-press); }

        /* Loading overlay */
        .loading-overlay {
          position: fixed; top: 0; left: 0; width: 100%; height: 100%;
          background: rgba(244, 249, 255, 0.85);
          display: none;
          justify-content: center;
          align-items: center;
          flex-direction: column;
          z-index: 2000;
          backdrop-filter: none;
        }
        .spinner {
          width: 40px; height: 40px;
          border: 4px solid #e5e7eb; border-top: 4px solid var(--primary);
          border-radius: 50%;
          animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) {
          .navbar { padding: 14px 20px; }
          .navbar-brand {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
          }
          .container { margin: 24px auto; }
          .card { padding: 22px; border-radius: 14px; }
        }
    </style>

</head>
<body>

<div class="navbar">
    <div class="navbar-brand">EduNote 내용 보기</div>
    <div class="user-info">
        <span id="userNameDisplay">사용자님</span>
        <button class="btn-logout" onclick="logout()">로그아웃</button>
    </div>
</div>

<div class="container">
    <div class="card">
        <h2 id="title">📄 내용</h2>
        <div class="meta">
            <div>파일명: <strong id="fileName">-</strong></div>
            <div>업로드 날짜: <strong id="createdAt">-</strong></div>
        </div>

        <div class="content-box" id="contentText">불러오는 중...</div>

        <div id="summaryBox" style="margin-top:18px; display:none;">
          <h3 style="margin-bottom:8px;">📝 요약 결과</h3>
          <div class="content-box" id="summaryText" style="background:#fffbe6; border-color:#fef3c7; color:#92400e;"></div>
        </div>

        <div class="actions">
          <button class="btn btn-back" onclick="goBack()">← 대시보드</button>
          <button class="btn btn-copy" id="summarizeBtn" onclick="summarizeRecord()" style="display:none;">요약하기</button>
        </div>
    </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <p style="margin-top: 15px; font-weight: 600; color: #374151;">AI가 열심히 작업 중입니다...</p>
</div>

<script>
    const token = localStorage.getItem('token');
    const userName = localStorage.getItem('userName');
    if (!token) {
      alert('로그인이 필요합니다.');
      window.location.href = '/index.html';
    }
    document.getElementById('userNameDisplay').textContent = (userName || '사용자') + '님';

    const params = new URLSearchParams(window.location.search);
    const recordId = params.get('recordId');

    if (!recordId) {
      alert('recordId가 없습니다.');
      window.location.href = '/dashboard.html';
    }

    async function readJsonSafe(response) {
      const ct = response.headers.get('content-type') || '';
      if (ct.includes('application/json')) return await response.json();
      const text = await response.text();
      return { message: text };
    }

    function showLoading(isShow) {
      document.getElementById('loadingOverlay').style.display = isShow ? 'flex' : 'none';
    }

    function formatDate(v) {
      if (!v) return '-';
      const d = new Date(v);
      if (isNaN(d.getTime())) return String(v);
      return d.toLocaleDateString('ko-KR');
    }

    // 1) 가능한 경우: 상세 조회 API를 우선 시도 (/api/v1/stt/records/{id})
    // 2) 없으면: 목록 API로 가져와서 id로 찾기 (/api/v1/stt/records)
    async function loadRecord() {
      showLoading(true);
      try {

        // fallback: list endpoint
        const resp = await fetch('/api/v1/stt/records', {
          method: 'GET',
          headers: { 'Authorization': 'Bearer ' + token }
        });

        const api = await readJsonSafe(resp);
        if (!resp.ok) {
          alert('기록 불러오기 실패: ' + (api.message || resp.statusText));
          showLoading(false);
          return;
        }

        const records = api.data || [];
        const found = records.find(x => String(x.id) === String(recordId));

        if (!found) {
          alert('해당 recordId의 기록을 찾을 수 없습니다.');
          showLoading(false);
          return;
        }

        renderRecord(found);

      } catch (e) {
        console.error(e);
        alert('오류 발생: ' + e.message);
      } finally {
        showLoading(false);
        // 레코드 로드 완료 후 기존 요약 로드 시도
        await loadExistingSummary();
      }
    }

    function renderRecord(r) {
      const fileName = r.fileName || ('record #' + (r.id ?? recordId));
      const createdAt = r.createdAt;

      document.getElementById('fileName').textContent = fileName;
      document.getElementById('createdAt').textContent = formatDate(createdAt);

      const text = (r.text && String(r.text).trim()) ? r.text : '내용 없음';
      document.getElementById('contentText').textContent = text;
    }

async function loadExistingSummary() {
  try {
    const resp = await fetch(`/api/records/${encodeURIComponent(recordId)}/summary`, {
      method: 'GET',
      headers: { 'Authorization': 'Bearer ' + token }
    });

    if (resp.ok) {
      const api = await readJsonSafe(resp);
      const data = api.data || {};
      const content = data.summary_content || '';

      if (String(content).trim()) {
        document.getElementById('summaryText').textContent = content;
        document.getElementById('summaryBox').style.display = 'block';
        document.getElementById('summarizeBtn').style.display = 'none';
        return;
      }
    }
  } catch (e) {
    console.log('기존 요약 로드 실패:', e.message);
  }

  document.getElementById('summarizeBtn').style.display = 'block';
}


    function goBack() {
      window.location.href = '/dashboard.html';
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('userId');
      localStorage.removeItem('userName');
      window.location.href = '/index.html';
    }

    async function summarizeRecord() {
      const btn = document.getElementById('summarizeBtn');
      try {
        if (!confirm('요약을 생성하시겠어요?')) return;
        btn.disabled = true;
        btn.textContent = '요약중...';
        showLoading(true);

        const resp = await fetch(`/api/records/${encodeURIComponent(recordId)}/summary`, {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token }
        });

        const api = await readJsonSafe(resp);
        if (!resp.ok) {
          throw new Error((api && api.message) || resp.statusText || '요약 요청 실패');
        }

        const data = api.data || api;

        const content =
          data.summary_content ||
          data.content ||
          data.summary ||
          '';

        // content가 비어있을 때를 대비한 디버기용
        const finalText = String(content).trim() ? content : '요약 결과가 비어있습니다.';

        document.getElementById('summaryText').textContent = finalText;
        document.getElementById('summaryBox').style.display = 'block';
        btn.style.display = 'none'; // 요약 완료 후 버튼 숨김
      } catch (e) {
        console.error(e);
        alert('요약 중 오류가 발생했습니다: ' + (e.message || e));
      } finally {
        btn.disabled = false;
        btn.textContent = '요약하기';
        showLoading(false);
      }
    }

    window.addEventListener('load', loadRecord);
</script>

</body>
</html>
