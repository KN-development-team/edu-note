<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduNote - 대시보드</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root{
          --bg-0: #f4f9ff;
          --bg-1: #eaf3ff;
          --bg-2: #dfeeff;

          --white: #ffffff;
          --text: #1f2937;
          --muted: #6b7280;
          --line: #e5e7eb;

          --primary: #2563eb;
          --primary-hover: #1d4ed8;
          --primary-press: #1e40af;

          --danger: #dc2626;

          --card-bg: rgba(255, 255, 255, 0.95);
          --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
          --shadow-md: 0 10px 30px rgba(0,0,0,0.06);
        }

        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
          background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 40%, var(--bg-2) 100%);
          min-height: 100vh;
          color: var(--text);
        }

        /* Navbar: index.html 톤(화이트 + border-bottom)으로 */
        .navbar {
          background: var(--white);
          padding: 16px 40px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          border-bottom: 1px solid var(--line);
          position: sticky;
          top: 0;
          z-index: 100;
        }

        .navbar-brand {
          font-size: 18px;
          font-weight: 700;
          color: var(--text);
          letter-spacing: -0.3px;
        }

        .user-info {
          display: flex;
          align-items: center;
          gap: 16px;
          font-size: 14px;
          color: var(--muted);
          font-weight: 500;
        }

        .btn-logout {
          color: var(--danger);
          background: none;
          border: none;
          cursor: pointer;
          font-weight: 600;
          padding: 8px 10px;
          border-radius: 6px;
          transition: background 0.2s;
        }
        .btn-logout:hover { background: rgba(220,38,38,0.06); }

        .container {
          max-width: 1000px;
          margin: 40px auto;
          padding: 0 20px;
        }

        /* Card: index의 auth-container 느낌(유리감 + 라운드 + 부드러운 그림자) */
        .card {
          background: var(--card-bg);
          border-radius: 16px;
          padding: 30px;
          box-shadow: var(--shadow-md);
          border: 1px solid rgba(229, 231, 235, 0.8);
          margin-bottom: 24px;
          backdrop-filter: none;
        }

        .card h2 {
          margin-bottom: 18px;
          font-size: 20px;
          color: var(--text);
          letter-spacing: -0.3px;
        }

        /* Upload */
        .upload-area {
          border: 2px dashed var(--line);
          border-radius: 12px;
          padding: 38px;
          text-align: center;
          transition: all 0.2s;
          cursor: pointer;
          background: rgba(249, 250, 251, 0.6);
        }
        .upload-area:hover {
          border-color: var(--primary);
          background: rgba(255, 255, 255, 0.9);
          box-shadow: 0 4px 20px rgba(37, 99, 235, 0.08);
        }
        .upload-icon { font-size: 40px; color: #9ca3af; margin-bottom: 10px; }
        .file-input { display: none; }

        .btn-upload {
          margin-top: 14px;
          padding: 10px 24px;
          background: var(--primary);
          color: white;
          border: none;
          border-radius: 6px;
          font-weight: 600;
          cursor: pointer;
          display: none;
          transition: background 0.2s;
        }
        .btn-upload:hover { background: var(--primary-hover); }
        .btn-upload:active { background: var(--primary-press); }

        /* Record list */
        .record-list { display: flex; flex-direction: column; gap: 12px; }

        .record-item {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 18px;
          border: 1px solid var(--line);
          border-radius: 12px;
          background: rgba(255,255,255,0.8);
          transition: all 0.2s;
        }
        .record-item:hover {
          border-color: var(--primary);
          box-shadow: 0 4px 20px rgba(37, 99, 235, 0.08);
          transform: translateY(-1px);
        }

        .record-info h3 { font-size: 16px; margin-bottom: 6px; color: var(--text); }
        .record-info p { font-size: 13px; color: var(--muted); }

        .action-buttons { display: flex; gap: 8px; }

        /* Buttons: index의 버튼 톤(블루 primary + 뉴트럴 secondary) */
        .btn-view {
          padding: 8px 14px;
          background: white;
          color: var(--text);
          border: 1px solid #d1d5db;
          border-radius: 6px;
          font-size: 13px;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.2s;
        }
        .btn-view:hover { background: #f9fafb; }

        .btn-quiz {
          padding: 8px 14px;
          background: var(--primary);
          color: white;
          border: none;
          border-radius: 6px;
          font-size: 13px;
          font-weight: 600;
          cursor: pointer;
          transition: background 0.2s;
        }
        .btn-quiz:hover { background: var(--primary-hover); }
        .btn-quiz:active { background: var(--primary-press); }

        /* Loading overlay: 더 자연스럽게 */
        .loading-overlay {
          position: fixed; top: 0; left: 0; width: 100%; height: 100%;
          background: rgba(244, 249, 255, 0.75);
          display: none;
          justify-content: center;
          align-items: center;
          flex-direction: column;
          z-index: 2000;
          backdrop-filter: blur(6px);
        }
        .spinner {
          width: 40px; height: 40px;
          border: 4px solid #e5e7eb; border-top: 4px solid var(--primary);
          border-radius: 50%;
          animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) {
          .navbar {
            padding: 14px 20px;
            will-change: transform;
          }
          .navbar-brand { font-size: 16px; }
          .container { margin: 24px auto; }
          .card { padding: 22px; border-radius: 14px; }
          .upload-area { padding: 28px; }
          .record-item { padding: 14px; }
        }
    </style>

</head>
<body>

<div class="navbar">
    <div class="navbar-brand">EduNote Dashboard</div>
    <div class="user-info">
        <span id="userNameDisplay">사용자님</span>
        <button class="btn-logout" onclick="logout()">로그아웃</button>
    </div>
</div>

<div class="container">
    <div class="card">
        <h2>새로운 강의 녹음 업로드</h2>
        <div class="upload-area" onclick="document.getElementById('voiceFile').click()">
            <div class="upload-icon">🎙️</div>
            <p id="uploadText">여기를 클릭하여 MP3 파일을 선택하세요</p>
            <input type="file" id="voiceFile" class="file-input" accept="audio/*" onchange="handleFileSelect(this)">
        </div>
        <div style="text-align: center;">
            <button class="btn-upload" id="uploadBtn" onclick="uploadFile()">변환 시작하기</button>
        </div>
    </div>

    <div class="card">
        <h2>내 학습 기록</h2>
        <div class="record-list" id="recordList"></div>
    </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <p style="margin-top: 15px; font-weight: 600; color: #374151;">AI가 열심히 작업 중입니다...</p>
</div>

<script>
    const token = localStorage.getItem('token');
    const userName = localStorage.getItem('userName');

    if (!token) {
      alert('로그인이 필요합니다.');
      window.location.href = '/index.html';
    }

    document.getElementById('userNameDisplay').textContent = (userName || '사용자') + '님';

    const recordCache = new Map();
    let selectedFile = null;

    window.addEventListener('load', () => {
      loadRecords();
    });

    function handleFileSelect(input) {
      if (input.files && input.files[0]) {
        selectedFile = input.files[0];
        document.getElementById('uploadText').textContent = "선택된 파일: " + selectedFile.name;
        document.getElementById('uploadBtn').style.display = 'inline-block';
      }
    }

    async function readJsonSafe(response) {
      const ct = response.headers.get('content-type') || '';
      if (ct.includes('application/json')) return await response.json();
      const text = await response.text();
      return { message: text };
    }

    async function uploadFile() {
      if (!selectedFile) return;

      const formData = new FormData();
      formData.append('file', selectedFile);

      showLoading(true);

      try {
        const response = await fetch('/api/v1/stt', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token },
          body: formData
        });

        const api = await readJsonSafe(response);

        if (!response.ok) {
          alert('업로드 실패: ' + (api.message || response.statusText));
          return;
        }

        const result = api.data; // {id, text}
        alert('변환이 완료되었습니다!');

        // 새로 만든 건 최신이라 맨 위에
        addRecordToUI({
          id: result.id,
          fileName: selectedFile.name,
          createdAt: Date.now(),
          text: result.text
        }, true);

        document.getElementById('uploadText').textContent = "여기를 클릭하여 MP3 파일을 선택하세요";
        document.getElementById('uploadBtn').style.display = 'none';
        selectedFile = null;

      } catch (error) {
        console.error('Error:', error);
        alert('오류 발생: ' + error.message);
      } finally {
        showLoading(false);
      }
    }

    function addRecordToUI(record, prepend) {
      const list = document.getElementById('recordList');
      recordCache.set(String(record.id), record);

      const dateText = record.createdAt
        ? new Date(record.createdAt).toLocaleDateString('ko-KR')
        : new Date().toLocaleDateString('ko-KR');

      const itemHTML = `
        <div class="record-item" id="record-${escapeHtml(String(record.id))}">
          <div class="record-info">
            <h3>📄 ${escapeHtml(record.fileName)}</h3>
            <p>업로드 날짜: ${escapeHtml(dateText)}</p>
          </div>
          <div class="action-buttons">
            <button class="btn-view" onclick="viewContent('${escapeAttr(String(record.id))}')">내용 보기</button>
            <button class="btn-quiz" onclick="goQuizPage('${escapeAttr(String(record.id))}')">퀴즈 페이지</button>
          </div>
        </div>
      `;

      if (prepend) list.insertAdjacentHTML('afterbegin', itemHTML);
      else list.insertAdjacentHTML('beforeend', itemHTML);
    }

    // alert 대신 페이지 이동
    function viewContent(recordId) {
      window.location.href = '/content.html?recordId=' + encodeURIComponent(recordId);
    }

    // 새로고침 시 DB에서 목록 다시 불러오기
    async function loadRecords() {
      try {
        const response = await fetch('/api/v1/stt/records', {
          method: 'GET',
          headers: { 'Authorization': 'Bearer ' + token }
        });

        const api = await readJsonSafe(response);

        if (!response.ok) {
          alert('기록 불러오기 실패: ' + (api.message || response.statusText));
          return;
        }

        const records = api.data || [];

        document.getElementById('recordList').innerHTML = '';
        recordCache.clear();

        // 서버가 최신순으로 주는 게 가장 좋고,
        // 여기서는 받은 순서대로 "아래로" 붙여서 UI도 최신순 유지하게 함
        records.forEach(r => {
          addRecordToUI({
            id: r.id,
            fileName: r.fileName || ('record #' + r.id),
            createdAt: r.createdAt,
            text: r.text
          }, false);
        });

      } catch (e) {
        console.error(e);
        alert('기록 불러오기 중 오류: ' + e.message);
      }
    }

    function goQuizPage(recordId) {
      window.location.href = '/quiz.html?recordId=' + encodeURIComponent(recordId);
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    // onclick 속성 안에 들어가는 값용(따옴표/백슬래시 안전)
    function escapeAttr(str) {
      return String(str ?? '')
        .replaceAll('\\', '\\\\')
        .replaceAll("'", "\\'")
        .replaceAll('\n', '\\n')
        .replaceAll('\r', '\\r');
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('userId');
      localStorage.removeItem('userName');
      window.location.href = '/index.html';
    }

    function showLoading(isShow) {
      document.getElementById('loadingOverlay').style.display = isShow ? 'flex' : 'none';
    }
</script>

</body>
</html>
